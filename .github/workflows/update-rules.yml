name: Update rules

on:
  schedule:
    - cron: "0 2 * * *"   # every day 02:00 UTC (10:00 Beijing time)
  workflow_dispatch:       # manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate rules
        run: python scripts/generate.py

      - name: Commit and push if changed
        if: ${{ !cancelled() }}   # still publish sources that succeeded if another failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update rules $(date -u +%Y-%m-%d)"
            git push
          fi
